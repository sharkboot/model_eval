tasks:
  - name: ifeval
    type: standard
    dataset:
      name: IFEval
      params:
        data_path: "data/ifeval/test.jsonl"
        limits: 50
    prompt_builder:
      name: qa_builder
    model:
      name: MiniMax
      params:
        generation_config:
          temperature: 0.0
          max_tokens: 512
    evaluators:
      - name: ifeval_rule
    output_path: results/ifeval
