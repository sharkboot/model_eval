tasks:
  - name: mmmu
    type: standard
    dataset:
      name: MMMU
      params:
        data_path: "data/mmmu/test.jsonl"
        image_dir: "data/mmmu/images"
        limits: 20  # 多模态测试建议少量
    prompt_builder:
      name: qa_builder
    model:
      name: MiniMax
      params:
        generation_config:
          temperature: 0.0
          max_tokens: 256
    evaluators:
      - name: accuracy
    output_path: results/mmmu
