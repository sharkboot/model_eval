tasks:
  - name: clue_wsc
    type: standard
    dataset:
      name: CLUEWSC
      params:
        data_path: "data/clue_wsc/test.jsonl"
        limits: 100
    prompt_builder:
      name: qa_builder
    model:
      name: MiniMax
      params:
        generation_config:
          temperature: 0.0
          max_tokens: 128
    evaluators:
      - name: accuracy
    output_path: results/clue_wsc
